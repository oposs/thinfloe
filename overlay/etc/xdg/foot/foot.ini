# foot, the terminal of the Terminal tile. thinfloe-terminal doubles the
# font's pixel size and the padding on a HiDPI screen; ~/.config/foot/foot.ini replaces this
# file for one machine.
#
# Smalti is a pixel font: it is sharp at 14 px and whole multiples only, so
# the size is given in pixels and dpi-aware is off.
[main]
font=Smalti 7x14:pixelsize=14
dpi-aware=no
pad=12x12
# In characters, not pixels: a pixel size makes a tiny window at 28 px.
initial-window-size-chars=100x30

[scrollback]
lines=10000
# foot draws no scroll bar. While scrolled back, a box on the right edge
# shows where in the scrollback the view is.
indicator-position=relative

# The menu's palette (src/thinfloe-menu/src/brand.rs): TILE, ICE.
[colors]
background=0d1218
foreground=d8dee6
scrollback-indicator=0d1218 7cc4ff
selection-foreground=0d1218
selection-background=7cc4ff
