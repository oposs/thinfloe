# The ESP, mounted by the initramfs (90thinfloe/mount-squashfs.sh). On a USB
# boot the root's squashfs is the loop file tl/ramroot.sqsh on it, so the ESP
# stays busy until the machine is off. With default dependencies the unit
# conflicts with umount.target, and its stop failed on every reboot with
# "Failed unmounting run-thinfloe-storage-efi.mount" (#69). Without them
# systemd leaves it to systemd-shutdown, which remounts it read-only like the
# root: the writes are flushed and the FAT's dirty bit is cleared.
[Unit]
DefaultDependencies=no
