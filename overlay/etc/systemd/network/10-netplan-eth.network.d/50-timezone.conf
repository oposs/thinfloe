# Ask the DHCP server for its time zone (option 101). networkd only writes the
# answer into the lease file; thinfloe-dhcp-timezone.path sees the file and
# /usr/libexec/thinfloe/dhcp-timezone sets the zone, because networkd's own
# call to timedated needs polkit, which this image lacks.
# "eth" is the id in /etc/netplan/ethernet.yaml. WiFi profiles from
# ~/wifi.yaml have ids the user chose and get no drop-in.
[DHCPv4]
UseTimezone=yes
