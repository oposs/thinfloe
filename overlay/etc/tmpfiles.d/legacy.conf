# ThinFloe: replaces /usr/lib/tmpfiles.d/legacy.conf from systemd, without
# its line
#   L$ /var/log/README - - - - ../../usr/share/doc/systemd/README.logs
# The image has no /usr/share/doc, so the link pointed at nothing. Every
# other line is systemd's; test-session-packages.sh fails when systemd's
# file changes, so this copy is compared again then.

L /var/lock - - - - ../run/lock

# /run/lock/subsys is used for serializing SysV service execution, and
# hence without use on SysV-less systems.
d /run/lock/subsys 0755 root root -
