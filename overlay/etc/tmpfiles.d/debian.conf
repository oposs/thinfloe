# ThinFloe: replaces /usr/lib/tmpfiles.d/debian.conf from systemd, without
# its line
#   L+ /etc/vconsole.conf  - - -  -  default/keyboard
# /etc/default/keyboard comes from keyboard-configuration, which the image
# does not install, and nothing in the image reads /etc/vconsole.conf (no
# kbd, no systemd-vconsole-setup; the keyboard layout is XKB's, set in
# Settings -> Keyboard). Every other line is systemd's;
# test-session-packages.sh fails when systemd's file changes.

# Type Path    Mode UID  GID  Age Argument
L /run/shm     -    -    -    -   /dev/shm
d /run/sendsigs.omit.d 0755 root root -
d /run/lock    1777 root root -   -

L+ /etc/mtab   -    -    -    -  ../proc/self/mounts
L+ /etc/default/locale - - -  -  ../locale.conf

C! /etc/nsswitch.conf - - - -
C! /etc/pam.d - - - -
C! /etc/issue - - - -
