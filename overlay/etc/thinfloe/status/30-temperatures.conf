# The temperatures, under the battery, the CPU first. Sensors that do not fit
# drop the least important; a hot or critical one has its line in the warning
# or alert colour. The sensors are read every 5 seconds, Refresh is how often
# the tile is drawn; not on a short screen (under 900 pt). Hidden when the
# machine has no sensor.
[Status Element]
Type=hardware
Show=temperatures
Cell=0,1
Size=1x1
ShortSize=none
Refresh=5
