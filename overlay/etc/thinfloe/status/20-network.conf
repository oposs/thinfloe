# The traffic of the default-route interface over the last five minutes,
# right of the battery, two cells wide and two high: the graph with its rate
# and time axes and its legend. The numbers stand in the list beside it,
# 25-network-info.conf. Sampled every second by the menu; drawn every second
# while the menu shows. On a short screen (under 900 pt) it is the graph
# alone, three cells wide and one high, edge to edge, the legend inside it.
[Status Element]
Type=network
Cell=1,0
Size=2x2
ShortSize=3x1
Refresh=1
