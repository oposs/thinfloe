# Output and input devices start at full level, so the remote desktop
# client (ThinLinc, OxuLnk) sets the loudness and the thin client passes it
# through unchanged. WirePlumber 0.5's own default for outputs is 0.064
# (40 % on a cubic slider, about -24 dB), and the image has no volume
# control at the machine to raise it.
#
# This is the default for a route that has no stored volume. A volume that
# a person sets (wpctl, pactl) is stored in ~/.local/state/wireplumber/
# and still wins; the default applied here is never stored
# (apply-routes.lua sets it with save = false).
wireplumber.settings = {
  device.routes.default-sink-volume = 1.0
  device.routes.default-source-volume = 1.0
}
