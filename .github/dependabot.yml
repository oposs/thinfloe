version: 2
# repo-infra: dependabot v4
#
# Purpose: Keep the pinned GitHub Actions and the dependencies of the
#   repository's own code current.
# Choose: Always.
# Supplies: The no-changelog label.
# Produces: Below the github-actions entry, check and apply expect one weekly
#   entry for each ecosystem the callers' CI pieces build: cargo for
#   ri-ci-rust and ri-ci-rust-musl, npm for ri-ci-node-pnpm, bun for
#   ri-ci-node-bun, pip for ri-ci-python, gomod for ri-ci-go. The other CI
#   pieces add none, and neither does a call that passes `repository`. The
#   entry reads directory /. When the "dependabot" key of
#   .github/repo-infra.json lists directories for its ecosystem, as in
#   {"cargo": ["/tools/gen"]}, it reads directories instead: / first, then
#   the listed ones in their order.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
      - no-changelog
