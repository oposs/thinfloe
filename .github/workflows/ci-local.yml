name: CI (ThinFloe)

# ThinFloe's own CI jobs, called from ci.yml (docs/release-ci.md, "CI
# split"). `unit` gives a result within minutes; `image` builds the rootfs
# once and runs the integration tests, the image, the nine QEMU smoke tests
# and the runtime tests on it. scripts/ci-runner-setup.sh prepares the
# runner (docs/release-ci.md, "Runner setup for the project's workflows").
on:
  workflow_call:
    inputs:
      ref:
        description: The commit to test; empty on push and pull_request.
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BUILD_JOBS: "4"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Replace the artifacts symlink with a directory
        run: scripts/ci-runner-setup.sh artifacts

      # MEMCAP= because the runner has no user manager for systemd-run.
      - name: make test-unit
        run: make test-unit MEMCAP=

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      BUILD_JOBS: "4"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Prepare the runner
        run: scripts/ci-runner-setup.sh all

      - name: make test
        run: make test MEMCAP=

      - name: make image
        run: make image MEMCAP=

      - name: make qemu-smoke
        run: make qemu-smoke MEMCAP=

      - name: make qemu-smoke-netboot
        run: make qemu-smoke-netboot MEMCAP=

      - name: make qemu-smoke-upgrade
        run: make qemu-smoke-upgrade MEMCAP=

      - name: make qemu-smoke-write
        run: make qemu-smoke-write MEMCAP=

      - name: make qemu-smoke-grow
        run: make qemu-smoke-grow MEMCAP=

      - name: make qemu-smoke-two-sticks
        run: make qemu-smoke-two-sticks MEMCAP=

      - name: make qemu-smoke-addons
        run: make qemu-smoke-addons MEMCAP=

      - name: make qemu-smoke-timezone
        run: make qemu-smoke-timezone MEMCAP=

      - name: make qemu-smoke-timezone-netboot
        run: make qemu-smoke-timezone-netboot MEMCAP=

      - name: make test-runtime
        run: make test-runtime MEMCAP=

      # The serial console logs of the smoke tests, their .1 and .2 boots and
      # the write test's HTTP log; the console tail alone rarely says why a
      # boot failed.
      - name: Upload the smoke test logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ci-logs
          path: artifacts/images/*.log*
          if-no-files-found: ignore
