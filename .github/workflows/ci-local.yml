name: CI (ThinFloe)

# ThinFloe's own CI jobs, called from ci.yml (docs/release-ci.md, "CI
# split"). `unit` runs the unit tests and gives a result within minutes;
# `image` builds the rootfs once, runs the integration tests (not the unit
# tests again), builds the image, uploads the five files the smoke tests
# read as the artifact `prebuilt` and runs the runtime tests. `smoke` runs
# the ten QEMU smoke tests in three parallel jobs on those files
# (PREBUILT=1, no rebuild; scripts/ci-check-prebuilt.sh checks that).
# scripts/ci-runner-setup.sh prepares each runner (docs/release-ci.md,
# "Runner setup for the project's workflows").
on:
  workflow_call:
    inputs:
      ref:
        description: The commit to test; empty on push and pull_request.
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BUILD_JOBS: "4"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Replace the artifacts symlink with a directory
        run: scripts/ci-runner-setup.sh artifacts

      # MEMCAP= because the runner has no user manager for systemd-run.
      - name: make test-unit
        run: make test-unit MEMCAP=

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      BUILD_JOBS: "4"
      # The cargo target directories of the container's menu-build stage
      # (docs/release-ci.md, "Cargo cache").
      BUILD_CACHE: /home/runner/build-cache
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Prepare the runner
        run: scripts/ci-runner-setup.sh all

      # Every run reads the newest cache a push to main saved; only a push
      # to main saves one, so pull requests do not fill the cache.
      - name: Restore the cargo cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.BUILD_CACHE }}/buildah-cache-*
          key: cargo-target-v1-${{ github.sha }}
          restore-keys: cargo-target-v1-

      - name: make test-integration
        run: make test-integration MEMCAP=

      - name: make image
        run: make image MEMCAP=

      - name: Save the cargo cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.BUILD_CACHE }}/buildah-cache-*
          key: cargo-target-v1-${{ github.sha }}

      - name: Record the prebuilt files
        run: scripts/ci-check-prebuilt.sh record

      # The files the smoke jobs read, and their manifest. Already
      # compressed, so no further compression.
      - name: Upload the prebuilt files
        uses: actions/upload-artifact@v7
        with:
          name: prebuilt
          path: |
            artifacts/rootfs/vmlinuz
            artifacts/rootfs/initrd.img
            artifacts/rootfs/ramroot.sqsh
            artifacts/images/thinfloe-usb.img.zst
            artifacts/images/thinfloe-usb.img.zst.sha256
            artifacts/prebuilt.sha256
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

      - name: make test-runtime
        run: make test-runtime MEMCAP=

  smoke:
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BUILD_JOBS: "4"
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: upgrade
            targets: qemu-smoke-upgrade
          - group: sticks
            targets: qemu-smoke-two-sticks qemu-smoke-write qemu-smoke-grow qemu-smoke-automount
          - group: boot
            targets: qemu-smoke qemu-smoke-netboot qemu-smoke-addons qemu-smoke-timezone qemu-smoke-timezone-netboot
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      # qemu, KVM, user namespaces and podman unshare (time zone smoke test).
      - name: Prepare the runner
        run: scripts/ci-runner-setup.sh all

      - name: Download the prebuilt files
        uses: actions/download-artifact@v8
        with:
          name: prebuilt
          path: artifacts

      - name: make ${{ matrix.targets }}
        run: make -k PREBUILT=1 MEMCAP= ${{ matrix.targets }}

      - name: Check that nothing was rebuilt
        if: success() || failure()
        run: scripts/ci-check-prebuilt.sh verify

      # The serial console logs of the smoke tests, their .1 and .2 boots and
      # the write test's HTTP log; the console tail alone rarely says why a
      # boot failed.
      - name: Upload the smoke test logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ci-logs-${{ matrix.group }}
          path: artifacts/images/*.log*
          if-no-files-found: ignore
