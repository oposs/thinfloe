name: Pages
# Publishes site/ to GitHub Pages. The page shows the release number from
# RELEASE, so a release (which changes RELEASE on main) publishes it again.

on:
  push:
    branches: [main]
    paths:
      - site/**
      - RELEASE
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Write the release number into the page
        run: |
          version=$(cat RELEASE)
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "RELEASE is not X.Y.Z: $version" >&2; exit 1; }
          sed -i "s|<span data-version>[^<]*</span>|<span data-version>$version</span>|" site/index.html
          grep -q "<span data-version>$version</span>" site/index.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5
