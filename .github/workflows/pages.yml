name: Pages
# Publishes site/ to GitHub Pages. The page shows the release number from
# RELEASE, so a release (which changes RELEASE on main) publishes it again.
#
# Two jobs, as in GitHub's Pages starter workflow: deploy-pages in the same
# job as upload-pages-artifact found no artifact 0.3 s after the upload had
# finished (run 45723254620, twice). A job of its own gives the artifact
# listing time to see it.

on:
  push:
    branches: [main]
    paths:
      - site/**
      - RELEASE
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read # configure-pages reads the site's settings
    steps:
      - uses: actions/checkout@v7
      - name: Write the release number into the page
        run: |
          version=$(cat RELEASE)
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "RELEASE is not X.Y.Z: $version" >&2; exit 1; }
          sed -i "s|<span data-version>[^<]*</span>|<span data-version>$version</span>|" site/index.html
          grep -q "<span data-version>$version</span>" site/index.html
      - name: Leave the making-of files out of the published page
        run: rm -r site/tools site/README.md
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
