name: Release build (ThinFloe)

# Builds the release image with TF_VERSION set to the release version, runs
# the nine QEMU smoke tests on exactly the bytes it uploads, and uploads the
# six release assets, one artifact release-asset-<name> each.
# scripts/ci-runner-setup.sh prepares the runner (docs/release-ci.md,
# "Runner setup for the project's workflows").
on:
  workflow_call:
    inputs:
      version:
        description: The version being released.
        type: string
        required: true
      ref:
        description: The release branch head to build.
        type: string
        required: true

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      BUILD_JOBS: "4"
      # Every make call needs it, not only `make image`: without it make
      # computes a dev version, re-exports the rootfs as a dev build and the
      # smoke tests and assets would carry that one.
      TF_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Prepare the runner
        run: scripts/ci-runner-setup.sh all

      - name: make image
        run: make image MEMCAP= TF_VERSION="$TF_VERSION"

      # The smoke tests must test the bytes that ship. A later make call
      # that rebuilds (for example after a failed podman image inspect drops
      # the container stamp) would ship a build the earlier smoke tests never
      # saw, with every step green; the check before the uploads compares
      # against these sums.
      - name: Record the checksums of the built files
        run: |
          for f in rootfs/vmlinuz rootfs/initrd.img rootfs/ramroot.sqsh images/thinfloe-usb.img.zst; do
            printf '%s  %s\n' "$(sha256sum <"artifacts/$f" | cut -d' ' -f1)" "${f##*/}"
          done >"$RUNNER_TEMP/built.sha256"
          cat "$RUNNER_TEMP/built.sha256"

      - name: make qemu-smoke
        run: make qemu-smoke MEMCAP= TF_VERSION="$TF_VERSION"

      - name: make qemu-smoke-netboot
        run: make qemu-smoke-netboot MEMCAP= TF_VERSION="$TF_VERSION"

      - name: make qemu-smoke-upgrade
        run: make qemu-smoke-upgrade MEMCAP= TF_VERSION="$TF_VERSION"

      - name: make qemu-smoke-write
        run: make qemu-smoke-write MEMCAP= TF_VERSION="$TF_VERSION"

      - name: make qemu-smoke-grow
        run: make qemu-smoke-grow MEMCAP= TF_VERSION="$TF_VERSION"

      - name: make qemu-smoke-two-sticks
        run: make qemu-smoke-two-sticks MEMCAP= TF_VERSION="$TF_VERSION"

      - name: make qemu-smoke-addons
        run: make qemu-smoke-addons MEMCAP= TF_VERSION="$TF_VERSION"

      - name: make qemu-smoke-timezone
        run: make qemu-smoke-timezone MEMCAP= TF_VERSION="$TF_VERSION"

      - name: make qemu-smoke-timezone-netboot
        run: make qemu-smoke-timezone-netboot MEMCAP= TF_VERSION="$TF_VERSION"

      # Refuses a build whose rootfs/version is not the release version.
      - name: make release-assets
        run: make release-assets MEMCAP= TF_VERSION="$TF_VERSION"

      - name: Check the assets are the smoke-tested build
        run: |
          grep -E '  (vmlinuz|initrd\.img|ramroot\.sqsh|thinfloe-usb\.img\.zst)$' artifacts/release/SHA256SUMS >"$RUNNER_TEMP/release.sha256"
          if ! diff -u "$RUNNER_TEMP/built.sha256" "$RUNNER_TEMP/release.sha256"; then
            echo "::error::the release assets differ from the build the smoke tests ran on; a make call rebuilt in between"
            exit 1
          fi

      # One artifact per file: the release takes every release-asset-*
      # artifact, and these names are the assets thinfloe-upgrade fetches.
      # The image and the SquashFS are compressed already.
      - name: Upload vmlinuz
        uses: actions/upload-artifact@v7
        with:
          name: release-asset-vmlinuz
          path: artifacts/release/vmlinuz
          if-no-files-found: error
          compression-level: 0

      - name: Upload initrd.img
        uses: actions/upload-artifact@v7
        with:
          name: release-asset-initrd.img
          path: artifacts/release/initrd.img
          if-no-files-found: error
          compression-level: 0

      - name: Upload ramroot.sqsh
        uses: actions/upload-artifact@v7
        with:
          name: release-asset-ramroot.sqsh
          path: artifacts/release/ramroot.sqsh
          if-no-files-found: error
          compression-level: 0

      - name: Upload thinfloe-usb.img.zst
        uses: actions/upload-artifact@v7
        with:
          name: release-asset-thinfloe-usb.img.zst
          path: artifacts/release/thinfloe-usb.img.zst
          if-no-files-found: error
          compression-level: 0

      - name: Upload version
        uses: actions/upload-artifact@v7
        with:
          name: release-asset-version
          path: artifacts/release/version
          if-no-files-found: error

      - name: Upload SHA256SUMS
        uses: actions/upload-artifact@v7
        with:
          name: release-asset-SHA256SUMS
          path: artifacts/release/SHA256SUMS
          if-no-files-found: error

      # The serial console logs of the smoke tests, their .1 and .2 boots and
      # the write test's HTTP log. The name does not start with
      # release-asset-, so the release never takes it.
      - name: Upload the smoke test logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: release-build-logs
          path: artifacts/images/*.log*
          if-no-files-found: ignore
