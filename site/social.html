<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ThinFloe: the social preview</title>
<meta name="robots" content="noindex">
<!-- The repository's social preview on GitHub, made to be photographed:
     tools/screenshots.sh --ads renders it at 1280x640 into ad/. GitHub's
     topic pages show it as a 725x275 card, so everything sits in the
     1280x485 band in the middle. -->
<style>
@font-face { font-family: "Geo"; src: url("fonts/geo-oblique.woff2") format("woff2"); font-style: oblique; }
html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; background: #05070a; }
body {
  background:
    radial-gradient(ellipse 60% 70% at 70% 60%, #0e2a40 0%, transparent 70%),
    linear-gradient(180deg, #05070a 0%, #07101a 100%);
}
.band {
  position: absolute; left: 0; right: 0; top: 77.5px; height: 485px;
  display: grid; grid-template-columns: 500px 600px; justify-content: center;
  gap: 56px; align-items: center;
}
.words { display: flex; flex-direction: column; align-items: flex-start; gap: 34px; }
.logo { height: 92px; fill: #fff; display: block; }
.water {
  width: 100%; height: 7px; background: #7cc4ff;
  clip-path: polygon(7px 0, 100% 0, calc(100% - 7px) 100%, 0 100%);
}
.claim { font-family: "Geo"; font-style: oblique; font-size: 66px; line-height: 1; color: #fff; }
.shot { width: 600px; height: auto; display: block; border: 2px solid #1e2630; }
</style>
</head>
<body>
<div class="band">
  <div class="words">
    <!-- The page's logo; the viewBox starts at the skewed T's left edge. -->
    <svg class="logo" viewBox="316 368 1252 284" role="img" aria-label="ThinFloe">
      <g transform="translate(0 632) skewX(-9) translate(0 -632)"><path d="M278 388H625V447H433V632H360V447H278Z"/><path d="M498 502H624V562H570V632H498Z"/></g>
      <path d="M805.73 580.51H787.02L806.47 457.46H775.95L778.66 439.49H856.92L854.21 457.46H824.92ZM951.17 580.51 968.64 469.52H909.09L917.95 414.15H899.24L873.16 580.51H891.61L906.38 487.24H946.25L931.48 580.51ZM1008.76 469.76 991.53 580.51H1009.99L1027.46 469.52ZM1017.61 414.15 1012.69 446.88H1031.15L1036.32 414.15ZM1132.79 580.51 1150.26 469.52H1072.25L1054.53 580.51H1073.23L1088 487.24H1127.86L1113.1 580.51ZM1189.39 580.51H1170.68L1192.83 439.49L1270.84 439.25L1268.14 456.97H1208.58L1203.91 487.48H1263.46L1260.51 505.2H1201.2ZM1313.17 414.15 1287.09 580.51H1305.54L1331.88 414.15ZM1350.09 580.51 1367.81 469.52H1445.82L1428.34 580.51ZM1424.16 487.73 1384.29 487.97 1372.48 562.79H1412.35ZM1495.53 535.22 1490.85 562.79H1549.42L1546.72 580.51H1468.46L1486.18 469.52H1563.7L1553.36 535.22ZM1498.24 517.01H1538.1L1542.53 487.73H1502.67Z"/>
    </svg>
    <div class="water" aria-hidden="true"></div>
    <div class="claim">A thin client<br>that floats<br>in RAM</div>
  </div>
  <img class="shot" src="img/menu.webp" width="2880" height="1920" alt="The ThinFloe menu: tiles, the status area and the log.">
</div>
</body>
</html>
